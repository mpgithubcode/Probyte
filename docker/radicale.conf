# Radicale inside the Probyte container (all-in-one mode, see docker/entrypoint.sh). Only Probyte talks to it
# (on 127.0.0.1); phones reach it through Probyte's own address. Paths are set by the entrypoint.

[server]
hosts = 127.0.0.1:5232

[auth]
type = htpasswd
htpasswd_encryption = bcrypt
htpasswd_cache = True
delay = 2

[rights]
type = owner_only

[web]
type = none

[logging]
level = warning
