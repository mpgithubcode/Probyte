services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: probyte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-probyte}
      POSTGRES_DB: probyte
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probyte -d probyte"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment: &probyte-env
      DATABASE_URL: postgresql://probyte:${POSTGRES_PASSWORD:-probyte}@db:5432/probyte
      DEFAULT_TZ: ${DEFAULT_TZ:-UTC}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-300}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      # Bundled CalDAV server: Probyte creates a login on it for every user.
      RADICALE_URL: http://radicale:5232/
      RADICALE_HTPASSWD: /radicale-users/users
      # The address users enter on their phones (your reverse-proxied Radicale URL).
      RADICALE_PUBLIC_URL: ${RADICALE_PUBLIC_URL:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # Linked tables: allow links to Probyte servers on private/LAN addresses (off = safer on open sign-up servers)
      REMOTE_ALLOW_PRIVATE: ${REMOTE_ALLOW_PRIVATE:-false}
      # Webhooks: allow deliveries to private/LAN addresses (e.g. n8n or Home Assistant on your network)
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      # Public address of Probyte (e.g. https://probyte.example.com), used in OAuth/MCP discovery. Default: from the request.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional fixed bearer token for MCP clients (16+ characters), acting as MCP_BEARER_USER (default: first admin)
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_BEARER_USER: ${MCP_BEARER_USER:-}
      MCP_BEARER_SCOPE: ${MCP_BEARER_SCOPE:-write}
    volumes:
      - radicale-users:/radicale-users
      - attachments:/data/attachments
    ports:
      - "${PROBYTE_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background jobs: calendar/contacts sync, webhook deliveries (with retries), cleanup. Same image as app.
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *probyte-env
    volumes:
      - radicale-users:/radicale-users
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy

  # CalDAV server for phones/desktop clients. Point your reverse proxy at port 5232
  # (preferably on its own subdomain, e.g. https://dav.example.com).
  radicale:
    build: ./radicale
    restart: unless-stopped
    volumes:
      - radicale-data:/data
      - radicale-users:/radicale-users:ro
    ports:
      - "${RADICALE_PORT:-5232}:5232"

volumes:
  attachments:
  pgdata:
  radicale-data:
  radicale-users:
